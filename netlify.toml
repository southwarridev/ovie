[build]
  publish = "website"
  command = "echo 'Ovie static site - no build required'"

[build.environment]
  NODE_VERSION = "20"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects
[[redirects]]
  from = "/docs"
  to = "/docs/getting-started.html"
  status = 302

[[redirects]]
  from = "/book"
  to = "/docs/book/index.html"
  status = 302

[[redirects]]
  from = "/install"
  to = "/#download"
  status = 302

[[redirects]]
  from = "/github"
  to = "https://github.com/southwarridev/ovie"
  status = 302

[[redirects]]
  from = "/gitlab"
  to = "https://gitlab.com/ovie1/ovie"
  status = 302

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "preview" }
