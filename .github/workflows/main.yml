---
# CI pipeline — runs on every push/PR to main or develop
# Builds the Rust workspace, runs tests, checks formatting, validates docs

name: CI — Ovie v2.3

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  OVIE_VERSION: "2.3.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # ── Build & Test (all 3 platforms) ───────────────────────────────────────
  build-and-test:
    name: Build & Test — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run aproko library tests
        run: cargo test --package aproko --lib -- --test-threads=2

      - name: Run bootstrap verification unit tests
        run: |
          cargo test --test bootstrap_verification_tests \
            test_bootstrap_verifier_creation \
            test_bootstrap_config_defaults \
            test_hash_determinism \
            test_rust_lexer_only \
            test_token_mismatch_detection \
            -- --test-threads=1
        continue-on-error: true

      - name: Verify oviec binary
        shell: bash
        run: |
          BIN=$(find target -name "oviec" -o -name "oviec.exe" \
                | grep -v "/deps/" | grep -v "/build/" | head -1)
          if [ -n "$BIN" ]; then
            echo "Found binary: $BIN"
            "$BIN" --version
          else
            echo "Binary not found in expected paths; searching..."
            find target -name "oviec*" -not -path "*/deps/*" | head -5
          fi

      - name: Run self-check
        shell: bash
        run: |
          BIN=$(find target -name "oviec" -o -name "oviec.exe" \
                | grep -v "/deps/" | grep -v "/build/" | head -1)
          [ -n "$BIN" ] && "$BIN" --self-check || echo "Binary not found, skipping self-check"
        continue-on-error: true

  # ── VS Code Extension ────────────────────────────────────────────────────
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/ovie-vscode/package-lock.json

      - name: Install dependencies
        working-directory: extensions/ovie-vscode
        run: npm install

      - name: Compile TypeScript
        working-directory: extensions/ovie-vscode
        run: npm run compile

      - name: Package extension
        working-directory: extensions/ovie-vscode
        run: npx @vscode/vsce package --no-dependencies

  # ── Documentation Check ──────────────────────────────────────────────────
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          OK=true
          for f in README.md LICENSE docs/getting-started.md docs/language-guide.md \
                   examples/hello.ov RELEASE_NOTES_v2.3.md; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f — missing"
              OK=false
            fi
          done
          [ "$OK" = "true" ] || exit 1

      - name: Check v2.3 content in README
        run: |
          grep -q "2.3"            README.md || (echo "❌ README missing v2.3 version" && exit 1)
          grep -q "module"         README.md || (echo "❌ README missing module system mention" && exit 1)
          grep -q "seeAm"          README.md || (echo "❌ README missing seeAm keyword example" && exit 1)
          echo "✅ README v2.3 content verified"

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ubuntu-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true   # warnings only, don't block CI

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true
