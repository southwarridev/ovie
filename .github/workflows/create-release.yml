---
# Manual one-click release creator for Ovie v2.3+
# Builds real binaries via cargo, assembles packages, publishes a GitHub release.

name: Create Ovie Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  OVIE_VERSION: ${{ github.event.inputs.version }}
  CARGO_TERM_COLOR: always

jobs:
  # ── Build all 4 platforms ─────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip

          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            archive: tar.gz

          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            archive: tar.gz

          - platform: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            ext: ''
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform }}-cargo-cr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-cr-

      - name: Build binaries
        run: |
          cargo build --release --bin oviec         --target ${{ matrix.target }}
          cargo build --release --bin oviec-analyze --target ${{ matrix.target }}

      - name: Verify
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"
          "$BIN" --version

      - name: Assemble package
        shell: bash
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          mkdir -p "$PKG/bin"

          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"         "$PKG/bin/"
          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"         "$PKG/bin/ovie${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/oviec-analyze${{ matrix.ext }}" "$PKG/bin/"

          cp -r std      "$PKG/"
          cp -r examples "$PKG/"
          cp -r docs     "$PKG/"

          for f in README.md LICENSE RELEASE_NOTES_v2.3.md CONTRIBUTING.md ovie.toml.template; do
            [ -f "$f" ] && cp "$f" "$PKG/"
          done
          [ -f "ovie.png" ] && cp "ovie.png" "$PKG/"

          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            [ -f "easy-windows-install.ps1" ] && cp "easy-windows-install.ps1" "$PKG/install.ps1"
            [ -f "easy-windows-install.bat" ] && cp "easy-windows-install.bat" "$PKG/install-easy.bat"
          else
            [ -f "easy-linux-install.sh"  ] && cp "easy-linux-install.sh"  "$PKG/install-easy.sh" && chmod +x "$PKG/install-easy.sh"
            [ -f "easy-macos-install.sh"  ] && cp "easy-macos-install.sh"  "$PKG/install-macos.sh" && chmod +x "$PKG/install-macos.sh"
          fi

          cat > "$PKG/VERSION.txt" << EOF
          Ovie v${{ env.OVIE_VERSION }} — Complete Module System
          Platform : ${{ matrix.platform }}
          Built    : $(date -u +"%Y-%m-%d %H:%M UTC")
          Commit   : ${{ github.sha }}
          EOF

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip" -Force

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          tar -czf "$PKG.tar.gz" "$PKG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovie-${{ matrix.platform }}
          path: ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}.*
          retention-days: 7

  # ── VS Code Extension ─────────────────────────────────────────────────────
  vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and package
        working-directory: extensions/ovie-vscode
        run: |
          npm install
          npm run compile
          npx @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: ovie-vscode-extension
          path: extensions/ovie-vscode/*.vsix
          retention-days: 7

  # ── Publish GitHub Release ────────────────────────────────────────────────
  release:
    name: Publish GitHub Release v${{ github.event.inputs.version }}
    needs: [build, vscode]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          if git rev-parse "v${{ env.OVIE_VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.OVIE_VERSION }} already exists"
          else
            git tag -a "v${{ env.OVIE_VERSION }}" -m "Ovie v${{ env.OVIE_VERSION }}"
            git push origin "v${{ env.OVIE_VERSION }}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets + checksums
        run: |
          mkdir -p releases
          find artifacts/ \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.vsix" \) \
            | while read f; do cp "$f" releases/; done
          cd releases && sha256sum * > checksums.txt
          echo "=== Release assets ===" && ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.OVIE_VERSION }}"
          name: "🎉 Ovie v${{ env.OVIE_VERSION }} — Complete Module System"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: |
            # 🚀 Ovie v${{ env.OVIE_VERSION }} — Complete Module System

            ## What's New in v2.3
            - **Module System** — `use`/`import`/`export`, dependency graph, SHA-256 caching
            - **Aproko Knowledge Base** — AI/LLM-accessible type info and reasoning rules
            - **Package Manager** — `oviec init`, `oviec add`, `oviec install`, `ovie.lock`
            - **oviec-analyze** — standalone analysis binary for `oviec analyze`/`explain`
            - **11 Standard Library Modules** — including `std::module` and `std::aproko`

            ## Quick Install
            **Windows:** `iwr -useb https://raw.githubusercontent.com/southwarridev/ovie/main/easy-windows-install.ps1 | iex`
            **Linux:** `curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-linux-install.sh | bash`
            **macOS:** `curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-macos-install.sh | bash`

            ## Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 | `ovie-v${{ env.OVIE_VERSION }}-windows-x64.zip` |
            | Linux x64 | `ovie-v${{ env.OVIE_VERSION }}-linux-x64.tar.gz` |
            | macOS Apple Silicon | `ovie-v${{ env.OVIE_VERSION }}-macos-arm64.tar.gz` |
            | macOS Intel | `ovie-v${{ env.OVIE_VERSION }}-macos-x64.tar.gz` |
            | VS Code Extension | `ovie-lang-*.vsix` |

            Verify: `oviec --version` · `oviec --self-check`
            SHA256 checksums in `checksums.txt`.
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
