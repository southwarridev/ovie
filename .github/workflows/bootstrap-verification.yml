name: Bootstrap Verification

# This workflow runs bootstrap verification to ensure the Ovie-in-Ovie lexer
# produces identical results to the Rust lexer.
#
# CURRENT STATUS: ACTIVE - Real self-hosting verification enabled

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'oviec/src/**'
      - 'ovie/src/**'
      - 'std/lexer/**'
      - 'scripts/bootstrap_verify.*'
      - '.github/workflows/bootstrap-verification.yml'
  pull_request:
    branches: [ main, develop ]
  
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose logging'
        required: false
        default: 'false'
        type: boolean
      benchmark:
        description: 'Enable performance benchmarking'
        required: false
        default: 'true'
        type: boolean

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  bootstrap-verification:
    name: Bootstrap Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            script: ./scripts/bootstrap_verify.sh
          - os: windows-latest
            script: pwsh scripts/bootstrap_verify.ps1
          - os: macos-latest
            script: ./scripts/bootstrap_verify.sh
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Build Rust compiler (Stage 0)
        run: cargo build --release --workspace
      
      - name: Run bootstrap verification
        id: bootstrap
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pwsh scripts/bootstrap_verify.ps1 $(if [ "${{ github.event.inputs.verbose }}" = "true" ]; then echo "--verbose"; fi) $(if [ "${{ github.event.inputs.benchmark }}" = "true" ]; then echo "--benchmark"; fi)
          else
            ./scripts/bootstrap_verify.sh $(if [ "${{ github.event.inputs.verbose }}" = "true" ]; then echo "--verbose"; fi) $(if [ "${{ github.event.inputs.benchmark }}" = "true" ]; then echo "--benchmark"; fi)
          fi
        continue-on-error: false
      
      - name: Check bootstrap verification result
        if: steps.bootstrap.outcome == 'failure'
        run: |
          echo "::error::Bootstrap verification failed on ${{ matrix.os }}"
          echo "The Ovie lexer does not produce identical output to the Rust lexer."
          exit 1
      
      - name: Upload bootstrap verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-report-${{ matrix.os }}
          path: |
            bootstrap_report.md
            target/real_bootstrap_verification/
          retention-days: 30
      
      - name: Upload bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-artifacts-${{ matrix.os }}
          path: |
            target/bootstrap_verification/
          retention-days: 7

  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: bootstrap-verification
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download bootstrap reports
        uses: actions/download-artifact@v4
        with:
          path: bootstrap-reports/
      
      - name: Analyze performance metrics
        run: |
          echo "Analyzing bootstrap performance metrics..."
          
          # Extract performance data from reports
          for report in bootstrap-reports/*/bootstrap_report.md; do
            if [ -f "$report" ]; then
              echo "Processing: $report"
              grep -E "Performance|Time|Ratio" "$report" || true
            fi
          done
          
          echo "Performance analysis complete"
      
      - name: Check performance degradation
        run: |
          echo "Checking for performance degradation..."
          
          # Extract performance ratios from reports
          for report in bootstrap-reports/*/bootstrap_report.md; do
            if [ -f "$report" ]; then
              echo "Checking: $report"
              # Look for performance ratio lines
              grep "performance ratio" "$report" || true
            fi
          done
          
          echo "Performance monitoring complete"

  ci-integration-tests:
    name: CI Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      
      - name: Verify bootstrap scripts exist
        run: |
          echo "Verifying bootstrap scripts..."
          
          # Check that scripts exist
          if [ ! -f "scripts/bootstrap_verify.sh" ]; then
            echo "::error::scripts/bootstrap_verify.sh not found"
            exit 1
          fi
          
          if [ ! -f "scripts/bootstrap_verify.ps1" ]; then
            echo "::error::scripts/bootstrap_verify.ps1 not found"
            exit 1
          fi
          
          # Check that scripts are executable
          if [ ! -x "scripts/bootstrap_verify.sh" ]; then
            echo "::warning::scripts/bootstrap_verify.sh is not executable"
            chmod +x scripts/bootstrap_verify.sh
          fi
          
          echo "Bootstrap scripts verified"
      
      - name: Verify CI workflow configuration
        run: |
          echo "Verifying CI workflow configuration..."
          
          # Check that workflow file is valid YAML
          if command -v yamllint &> /dev/null; then
            yamllint .github/workflows/bootstrap-verification.yml
          else
            echo "yamllint not available, skipping YAML validation"
          fi
          
          echo "CI configuration verified"

  summary:
    name: Bootstrap Verification Summary
    runs-on: ubuntu-latest
    needs: [bootstrap-verification, performance-monitoring, ci-integration-tests]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# Bootstrap Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Real Self-Hosting Verification Active ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "- Bootstrap Verification: ${{ needs.bootstrap-verification.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Monitoring: ${{ needs.performance-monitoring.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- CI Integration Tests: ${{ needs.ci-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## About" >> $GITHUB_STEP_SUMMARY
          echo "This workflow verifies that the Ovie lexer written in Ovie produces" >> $GITHUB_STEP_SUMMARY
          echo "identical output to the Rust lexer, demonstrating real self-hosting capability." >> $GITHUB_STEP_SUMMARY
      
      - name: Check overall status
        run: |
          if [ "${{ needs.bootstrap-verification.result }}" != "success" ]; then
            echo "::error::Bootstrap verification failed"
            exit 1
          fi
          
          if [ "${{ needs.performance-monitoring.result }}" != "success" ]; then
            echo "::warning::Performance monitoring encountered issues"
          fi
          
          if [ "${{ needs.ci-integration-tests.result }}" != "success" ]; then
            echo "::error::CI integration tests failed"
            exit 1
          fi
          
          echo "✅ All bootstrap verification checks passed"
