---
name: Bootstrap Verification

on:
  push:
    branches: [main, develop]
    paths:
      - 'oviec/src/**'
      - 'std/lexer/**'
      - 'scripts/bootstrap_verify.*'
      - '.github/workflows/bootstrap-verification.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  # ── CI integration tests ─────────────────────────────────────────────────
  # Verifies scripts exist and runs unit tests that don't need a full
  # Ovie-in-Ovie compiler.
  ci-integration-tests:
    name: CI Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-bootstrap-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-bootstrap-

      - name: Verify bootstrap scripts exist and are executable
        run: |
          chmod +x scripts/bootstrap_verify.sh
          [ -f "scripts/bootstrap_verify.sh" ] && echo "OK bootstrap_verify.sh" || (echo "MISSING bootstrap_verify.sh" && exit 1)
          [ -f "scripts/bootstrap_verify.ps1" ] && echo "OK bootstrap_verify.ps1" || (echo "MISSING bootstrap_verify.ps1" && exit 1)

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run script structure tests
        # Tests live in oviec/tests/bootstrap/script_integration_tests.rs
        # They check that the .sh and .ps1 scripts have the right content.
        # Run from workspace root so relative paths (scripts/) resolve correctly.
        run: |
          cargo test \
            test_bootstrap_verify_sh_exists \
            test_bootstrap_verify_ps1_exists \
            test_bootstrap_verify_sh_shebang \
            test_bootstrap_verify_sh_structure \
            test_bootstrap_verify_ps1_structure \
            test_scripts_have_cleanup \
            test_scripts_check_for_rust \
            test_scripts_use_cargo_build \
            test_scripts_have_error_handling \
            test_scripts_have_colored_output \
            test_scripts_compare_outputs \
            test_scripts_use_examples \
            test_scripts_report_results \
            test_scripts_have_documentation \
            test_scripts_handle_missing_compilers \
            test_scripts_create_compiler_stages \
            test_scripts_run_self_check \
            test_scripts_provide_next_steps \
            -- --test-threads=1

      - name: Run bootstrap verification unit tests
        # Tests live in oviec/tests/bootstrap_verification_tests.rs
        # Only tests that don't require a full Ovie-in-Ovie compiler.
        run: |
          cargo test --test bootstrap_verification_tests \
            test_bootstrap_verifier_creation \
            test_bootstrap_config_defaults \
            test_hash_determinism \
            test_rust_lexer_only \
            test_token_mismatch_detection \
            test_verification_report_generation \
            -- --test-threads=1

  # ── Bootstrap build verification ─────────────────────────────────────────
  # Confirms the workspace compiles on all 3 platforms.
  bootstrap-verification:
    name: Bootstrap Verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bv-

      - name: Build workspace (verify compilation)
        run: cargo build --release --workspace

      - name: Verify oviec binary
        shell: bash
        run: |
          BIN=$(find target -name "oviec" -o -name "oviec.exe" \
                | grep -v "/deps/" | grep -v "/build/" | head -1)
          if [ -n "$BIN" ]; then
            echo "Found: $BIN"
            "$BIN" --version
          else
            echo "Binary not found in expected location — checking target tree"
            find target -name "oviec*" -not -path "*/deps/*" | head -5
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-build-${{ matrix.os }}
          path: |
            target/**/release/oviec
            target/**/release/oviec.exe
          retention-days: 7
          if-no-files-found: ignore

  # ── Performance monitoring ────────────────────────────────────────────────
  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: bootstrap-verification
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts/
          pattern: bootstrap-build-*
          merge-multiple: true

      - name: Report build status
        run: |
          echo "Bootstrap build result: ${{ needs.bootstrap-verification.result }}"
          find build-artifacts/ -type f 2>/dev/null | head -10 || echo "No artifacts"
          echo "Performance monitoring complete"

  # ── Summary ───────────────────────────────────────────────────────────────
  summary:
    name: Bootstrap Verification Summary
    runs-on: ubuntu-latest
    needs: [bootstrap-verification, performance-monitoring, ci-integration-tests]
    if: always()
    steps:
      - name: Write job summary
        run: |
          {
            echo "# Bootstrap Verification Summary"
            echo ""
            echo "**Status**: Infrastructure Ready"
            echo ""
            echo "## Results"
            echo "- Bootstrap Build: ${{ needs.bootstrap-verification.result }}"
            echo "- Performance Monitoring: ${{ needs.performance-monitoring.result }}"
            echo "- CI Integration Tests: ${{ needs.ci-integration-tests.result }}"
            echo ""
            echo "## Test files used"
            echo "- \`oviec/tests/bootstrap/script_integration_tests.rs\`"
            echo "- \`oviec/tests/bootstrap_verification_tests.rs\`"
            echo ""
            echo "Full Ovie-in-Ovie self-hosting tests are marked \`#[ignore]\`"
            echo "and will be activated once the Ovie lexer is functional."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate required checks
        run: |
          CI="${{ needs.ci-integration-tests.result }}"
          BUILD="${{ needs.bootstrap-verification.result }}"
          echo "CI Integration Tests : $CI"
          echo "Bootstrap Build      : $BUILD"
          if [ "$CI" = "failure" ]; then
            echo "::error::CI integration tests failed"
            exit 1
          fi
          if [ "$BUILD" = "failure" ]; then
            echo "::warning::Bootstrap build failed on one or more platforms"
          fi
          echo "Bootstrap verification summary complete"
