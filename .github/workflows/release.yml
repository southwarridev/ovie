---
# Canonical release workflow for Ovie v2.3+
# Delegates to release-v2.3.yml via workflow_call, or use directly.
# Triggered by: push of a version tag (v2.3.x, v2.4.x, v3.x)

name: Release — Ovie

on:
  push:
    tags:
      - 'v2.3.*'
      - 'v2.4.*'
      - 'v3.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

# Delegate everything to the authoritative v2.3 release workflow
# so we have a single source of truth.
jobs:
  run-v23-release:
    uses: ./.github/workflows/release-v2.3.yml
    secrets: inherit
    with:
      version: ${{ github.event.inputs.version || '2.3.0' }}
      create_release: ${{ github.event.inputs.create_release == '' || github.event.inputs.create_release == 'true' }}
      prerelease: ${{ github.event.inputs.prerelease == 'true' }}
