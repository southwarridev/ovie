---
# Manual trigger release for Ovie v2.3+
# Identical to create-release.yml but with an extra "create tag" toggle.

name: Manual Release — Ovie v2.3

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'
      create_tag:
        description: 'Create and push a new git tag'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  OVIE_VERSION: ${{ github.event.inputs.version }}
  CARGO_TERM_COLOR: always

jobs:
  # ── Build all 4 platforms ─────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest,  target: x86_64-pc-windows-msvc, ext: .exe, archive: zip    }
          - { platform: linux-x64,   os: ubuntu-latest,   target: x86_64-unknown-linux-gnu, ext: '',  archive: tar.gz }
          - { platform: macos-arm64, os: macos-latest,    target: aarch64-apple-darwin,    ext: '',  archive: tar.gz }
          - { platform: macos-x64,   os: macos-13,        target: x86_64-apple-darwin,     ext: '',  archive: tar.gz }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform }}-cargo-manual-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-manual-

      - name: Build binaries
        run: |
          cargo build --release --bin oviec         --target ${{ matrix.target }}
          cargo build --release --bin oviec-analyze --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}" --version

      - name: Assemble package
        shell: bash
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          mkdir -p "$PKG/bin"

          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"         "$PKG/bin/"
          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"         "$PKG/bin/ovie${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/oviec-analyze${{ matrix.ext }}" "$PKG/bin/"

          cp -r std examples docs "$PKG/"

          for f in README.md LICENSE RELEASE_NOTES_v2.3.md ovie.toml.template; do
            [ -f "$f" ] && cp "$f" "$PKG/"
          done
          [ -f "ovie.png" ] && cp "ovie.png" "$PKG/"

          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            [ -f "easy-windows-install.ps1" ] && cp "easy-windows-install.ps1" "$PKG/install.ps1"
          else
            if [[ "${{ matrix.platform }}" == macos* ]]; then
              [ -f "easy-macos-install.sh" ] && cp "easy-macos-install.sh" "$PKG/install.sh" && chmod +x "$PKG/install.sh"
            else
              [ -f "easy-linux-install.sh" ] && cp "easy-linux-install.sh" "$PKG/install.sh" && chmod +x "$PKG/install.sh"
            fi
          fi

          printf "Ovie v%s — Complete Module System\nPlatform: %s\nBuilt: %s\nCommit: %s\n" \
            "${{ env.OVIE_VERSION }}" "${{ matrix.platform }}" \
            "$(date -u +"%Y-%m-%d %H:%M UTC")" "${{ github.sha }}" > "$PKG/VERSION.txt"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip" -Force

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          tar -czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: ovie-${{ matrix.platform }}
          path: ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}.*
          retention-days: 7

  # ── VS Code Extension ─────────────────────────────────────────────────────
  vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: extensions/ovie-vscode
        run: |
          npm install
          npm run compile
          npx @vscode/vsce package --no-dependencies
        name: Build extension
      - uses: actions/upload-artifact@v4
        with:
          name: ovie-vscode-extension
          path: extensions/ovie-vscode/*.vsix
          retention-days: 7

  # ── Create Tag & Publish Release ─────────────────────────────────────────
  release:
    name: Publish Release v${{ github.event.inputs.version }}
    needs: [build, vscode]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create git tag
        if: github.event.inputs.create_tag == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          if git rev-parse "v${{ env.OVIE_VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.OVIE_VERSION }} already exists — skipping"
          else
            git tag -a "v${{ env.OVIE_VERSION }}" -m "Ovie v${{ env.OVIE_VERSION }} — Complete Module System"
            git push origin "v${{ env.OVIE_VERSION }}"
            echo "Created and pushed tag v${{ env.OVIE_VERSION }}"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p releases
          find artifacts/ \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.vsix" \) \
            | while read f; do cp "$f" releases/; done
          cd releases && sha256sum * > checksums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.OVIE_VERSION }}"
          name: "🎉 Ovie v${{ env.OVIE_VERSION }} — Complete Module System"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            # Ovie v${{ env.OVIE_VERSION }} — Complete Module System

            Built from source via `cargo build --release`.

            **New in v2.3**: Module System · Aproko KB · Package Manager · `oviec-analyze` · 11 stdlib modules

            **Quick install:**
            - Windows: `iwr -useb https://raw.githubusercontent.com/southwarridev/ovie/main/easy-windows-install.ps1 | iex`
            - Linux: `curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-linux-install.sh | bash`
            - macOS: `curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-macos-install.sh | bash`

            SHA256 checksums in `checksums.txt`.
            Verify: `oviec --version` · `oviec --self-check`
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ Ovie v${{ env.OVIE_VERSION }} Released" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: Windows x64 · Linux x64 · macOS arm64 · macOS x64" >> $GITHUB_STEP_SUMMARY
          echo "**Release**: https://github.com/southwarridev/ovie/releases/tag/v${{ env.OVIE_VERSION }}" >> $GITHUB_STEP_SUMMARY
