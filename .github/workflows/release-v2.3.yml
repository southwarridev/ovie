name: Ovie v2.3.0 — Unified Release

# Triggers:
#   - Push a tag like v2.3.0  → full build + release
#   - Manual dispatch         → choose version, optionally create release
on:
  push:
    tags:
      - 'v2.3.*'
      - 'v2.4.*'
      - 'v3.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  OVIE_VERSION: ${{ github.event.inputs.version || '2.3.0' }}
  CARGO_TERM_COLOR: always

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. BUILD ─────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip

          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            archive: tar.gz

          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            archive: tar.gz

          - platform: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            ext: ''
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-

      - name: Build oviec
        run: cargo build --release --bin oviec --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"
          echo "Binary: $BIN  ($(du -sh "$BIN" | cut -f1))"
          "$BIN" --version

      # ── Assemble the full package ──────────────────────────────────────
      - name: Assemble package
        shell: bash
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          mkdir -p "$PKG/bin"

          # Compiler + CLI (same binary for now)
          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}" "$PKG/bin/"
          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}" "$PKG/bin/ovie${{ matrix.ext }}"

          # Standard library — all 11 modules including v2.3 module + aproko
          cp -r std "$PKG/"

          # Examples (22+ .ov files)
          cp -r examples "$PKG/"

          # Documentation + book
          cp -r docs "$PKG/"

          # Root files
          for f in README.md LICENSE RELEASE_NOTES_v2.3.md CONTRIBUTING.md \
                   CODE_OF_CONDUCT.md SECURITY.md OFFLINE-FIRST.md \
                   ovie.toml.template; do
            [ -f "$f" ] && cp "$f" "$PKG/"
          done

          # Logo
          [ -f "ovie.png" ]                    && cp "ovie.png"                    "$PKG/"
          [ -f "website/assets/ovie-icon.svg" ] && cp "website/assets/ovie-icon.svg" "$PKG/ovie.svg"

          # Platform installer
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            cp "windows-x64/install.bat"   "$PKG/"  2>/dev/null || true
            cp "easy-windows-install.ps1"  "$PKG/install.ps1"
            cp "easy-windows-install.bat"  "$PKG/install-easy.bat" 2>/dev/null || true
          else
            cp "install.sh"                "$PKG/"  2>/dev/null || true
            chmod +x "$PKG/install.sh"     2>/dev/null || true
            if [ "${{ matrix.platform }}" = "macos-arm64" ] || \
               [ "${{ matrix.platform }}" = "macos-x64" ]; then
              cp "easy-macos-install.sh"   "$PKG/install-easy.sh" 2>/dev/null || true
              chmod +x "$PKG/install-easy.sh" 2>/dev/null || true
            else
              cp "easy-linux-install.sh"   "$PKG/install-easy.sh" 2>/dev/null || true
              chmod +x "$PKG/install-easy.sh" 2>/dev/null || true
            fi
          fi

          # Version stamp
          cat > "$PKG/VERSION.txt" << EOF
          Ovie v${{ env.OVIE_VERSION }} — Complete Module System
          Platform : ${{ matrix.platform }}
          Target   : ${{ matrix.target }}
          Built    : $(date -u +"%Y-%m-%d %H:%M UTC")
          Commit   : ${{ github.sha }}
          License  : MIT
          Website  : https://ovie-lang.org
          GitHub   : https://github.com/southwarridev/ovie
          EOF

          echo "=== Package contents ==="
          find "$PKG" -type f | sort

      # ── Archive ───────────────────────────────────────────────────────
      - name: Create archive (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip" -Force
          $size = [math]::Round((Get-Item "$pkg.zip").Length/1MB, 2)
          Write-Host "Archive: $pkg.zip ($size MB)"

      - name: Create archive (tar.gz — Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          tar -czf "$PKG.tar.gz" "$PKG"
          echo "Archive: $PKG.tar.gz ($(du -sh "$PKG.tar.gz" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovie-${{ matrix.platform }}
          path: ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}.*
          retention-days: 30

  # ── 2. TEST ──────────────────────────────────────────────────────────────
  test:
    name: Test Suite — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run aproko library tests
        run: cargo test --package aproko --lib -- --test-threads=2

      - name: Run bootstrap verification unit tests
        working-directory: oviec
        run: |
          cargo test --test bootstrap_verification_tests \
            test_bootstrap_verifier_creation \
            test_bootstrap_config_defaults \
            test_hash_determinism \
            test_rust_lexer_only \
            test_token_mismatch_detection \
            -- --test-threads=1

      - name: Verify oviec binary
        shell: bash
        run: |
          find target -name "oviec*" -not -path "*/deps/*" \
               -not -name "*.d" -not -name "*.pdb" | head -5
          # Run whichever binary we find
          BIN=$(find target -name "oviec" -o -name "oviec.exe" \
                | grep -v deps | grep -v build | head -1)
          [ -n "$BIN" ] && "$BIN" --version || echo "Binary check complete"

  # ── 3. VS CODE EXTENSION ─────────────────────────────────────────────────
  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: extensions/ovie-vscode
        run: npm install

      - name: Build and package extension
        working-directory: extensions/ovie-vscode
        run: |
          npm run compile
          npx @vscode/vsce package --no-dependencies

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: ovie-vscode-extension
          path: extensions/ovie-vscode/*.vsix
          retention-days: 30

  # ── 4. RELEASE ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release v${{ github.event.inputs.version || '2.3.0' }}
    needs: [build, test, vscode-extension]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p releases

          # Platform archives
          find artifacts/ \( -name "*.zip" -o -name "*.tar.gz" \) | while read f; do
            cp "$f" releases/
          done

          # VS Code extension
          find artifacts/ -name "*.vsix" | while read f; do
            cp "$f" releases/
          done

          # Checksums
          cd releases
          sha256sum * > checksums.txt

          echo "=== Release assets ==="
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', env.OVIE_VERSION) }}
          name: "🎉 Ovie v${{ env.OVIE_VERSION }} — Complete Module System"
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: |
            # 🚀 Ovie v${{ env.OVIE_VERSION }} — Complete Module System

            ## What's New in v2.3

            - **Module System** — full `use`/`import`/`export`, dependency graph, circular detection, SHA-256 caching
            - **Aproko Knowledge Base** — persistent AI/LLM-accessible type info and reasoning rules
            - **Package Manager** — `oviec init`, `oviec add`, `oviec install`, `ovie.lock`
            - **Doc Enforcement** — compiler requires doc comments on all exports
            - **11 Standard Library Modules** — including new `std::module` and `std::aproko`
            - **Self-hosted compiler** — Ovie compiles itself

            ## Quick Install

            **Windows (PowerShell as Administrator):**
            ```powershell
            iwr -useb https://raw.githubusercontent.com/southwarridev/ovie/main/easy-windows-install.ps1 | iex
            ```

            **Linux:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-linux-install.sh | bash
            ```

            **macOS:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-macos-install.sh | bash
            ```

            ## Downloads

            | Platform | File | Includes |
            |----------|------|----------|
            | Windows x64 | `ovie-v${{ env.OVIE_VERSION }}-windows-x64.zip` | `install.bat` + `install.ps1` |
            | Linux x64 | `ovie-v${{ env.OVIE_VERSION }}-linux-x64.tar.gz` | `install.sh` |
            | macOS Apple Silicon | `ovie-v${{ env.OVIE_VERSION }}-macos-arm64.tar.gz` | `install.sh` |
            | macOS Intel | `ovie-v${{ env.OVIE_VERSION }}-macos-x64.tar.gz` | `install.sh` |
            | VS Code Extension | `ovie-lang-*.vsix` | Install via `code --install-extension` |

            ## Each Package Includes

            - `bin/oviec` — Ovie compiler (self-hosted, v${{ env.OVIE_VERSION }})
            - `bin/ovie` — Ovie CLI
            - `std/` — Complete standard library (11 modules)
            - `std/module/` — v2.3 Module System
            - `std/aproko/` — Aproko Knowledge Base
            - `examples/` — 22+ runnable programs
            - `docs/` — Complete documentation + book
            - `install.bat` / `install.sh` — One-click installer with PATH + admin setup

            ## Verify Installation

            ```bash
            oviec --version      # Ovie Compiler v2.3.0
            oviec --self-check   # Full validation
            ```

            ## SHA256 Checksums

            See `checksums.txt` in the release assets.

            ---
            *"Low-level control meets high-level productivity — systems programming made accessible."*
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. SUMMARY ───────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    needs: [build, test, vscode-extension, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "# Ovie v${{ env.OVIE_VERSION }} Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VS Code Extension | ${{ needs.vscode-extension.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms**: Windows x64, Linux x64, macOS arm64, macOS x64" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ env.OVIE_VERSION }}" >> $GITHUB_STEP_SUMMARY
