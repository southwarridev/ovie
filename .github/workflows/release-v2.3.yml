---
name: Ovie v2.3 — Unified Release

# Triggered by:
#   • Push of a version tag (v2.3.x, v2.4.x, v3.x)
#   • Manual dispatch
#   • workflow_call from release.yml (canonical delegation)

on:
  push:
    tags:
      - 'v2.3.*'
      - 'v2.4.*'
      - 'v3.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'
      create_release:
        description: 'Create GitHub release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: '2.3.0'
      create_release:
        type: boolean
        required: false
        default: true
      prerelease:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

env:
  OVIE_VERSION: ${{ inputs.version || github.event.inputs.version || '2.3.0' }}
  CARGO_TERM_COLOR: always

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. BUILD ─────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip

          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            archive: tar.gz

          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            archive: tar.gz

          # macos-13 is the last GitHub-hosted Intel Mac runner
          - platform: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            ext: ''
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-

      # Build both binaries
      - name: Build oviec
        run: cargo build --release --bin oviec --target ${{ matrix.target }}

      - name: Build oviec-analyze
        run: cargo build --release --bin oviec-analyze --target ${{ matrix.target }}

      - name: Verify binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"
          echo "Binary: $BIN  ($(du -sh "$BIN" | cut -f1))"
          "$BIN" --version

      # ── Assemble the full package ────────────────────────────────────────
      - name: Assemble package
        shell: bash
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          mkdir -p "$PKG/bin"

          # Compiler + CLI (same binary for now) + analyze companion
          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"         "$PKG/bin/"
          cp "target/${{ matrix.target }}/release/oviec${{ matrix.ext }}"         "$PKG/bin/ovie${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/oviec-analyze${{ matrix.ext }}" "$PKG/bin/"

          # Standard library — all 11 modules including v2.3 module + aproko
          cp -r std "$PKG/"

          # Examples (22+ .ov files)
          cp -r examples "$PKG/"

          # Documentation + book
          cp -r docs "$PKG/"

          # Root files
          for f in README.md LICENSE RELEASE_NOTES_v2.3.md CONTRIBUTING.md \
                   CODE_OF_CONDUCT.md ovie.toml.template; do
            [ -f "$f" ] && cp "$f" "$PKG/"
          done

          # Logo
          [ -f "ovie.png" ]                    && cp "ovie.png"                    "$PKG/"
          [ -f "website/assets/ovie-icon.svg" ] && cp "website/assets/ovie-icon.svg" "$PKG/ovie.svg"

          # Platform installer
          if [ "${{ matrix.platform }}" = "windows-x64" ]; then
            [ -f "windows-x64/install.bat" ]  && cp "windows-x64/install.bat"  "$PKG/"
            [ -f "easy-windows-install.ps1" ] && cp "easy-windows-install.ps1" "$PKG/install.ps1"
            [ -f "easy-windows-install.bat" ] && cp "easy-windows-install.bat" "$PKG/install-easy.bat"
          else
            [ -f "install.sh" ]               && cp "install.sh"               "$PKG/" && chmod +x "$PKG/install.sh"
            if [[ "${{ matrix.platform }}" == macos* ]]; then
              [ -f "easy-macos-install.sh" ]  && cp "easy-macos-install.sh"   "$PKG/install-easy.sh" && chmod +x "$PKG/install-easy.sh"
            else
              [ -f "easy-linux-install.sh" ]  && cp "easy-linux-install.sh"   "$PKG/install-easy.sh" && chmod +x "$PKG/install-easy.sh"
            fi
          fi

          # Version stamp
          cat > "$PKG/VERSION.txt" << EOF
          Ovie v${{ env.OVIE_VERSION }} — Complete Module System
          Platform : ${{ matrix.platform }}
          Target   : ${{ matrix.target }}
          Built    : $(date -u +"%Y-%m-%d %H:%M UTC")
          Commit   : ${{ github.sha }}
          License  : MIT
          Website  : https://ovie-lang.org
          GitHub   : https://github.com/southwarridev/ovie
          EOF

          echo "=== Package contents ==="
          find "$PKG" -type f | sort

      # ── Archive ──────────────────────────────────────────────────────────
      - name: Create archive (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          Compress-Archive -Path "$pkg\*" -DestinationPath "$pkg.zip" -Force
          $size = [math]::Round((Get-Item "$pkg.zip").Length/1MB, 2)
          Write-Host "Archive: $pkg.zip ($size MB)"

      - name: Create archive (tar.gz — Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          PKG="ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}"
          tar -czf "$PKG.tar.gz" "$PKG"
          echo "Archive: $PKG.tar.gz ($(du -sh "$PKG.tar.gz" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ovie-${{ matrix.platform }}
          path: ovie-v${{ env.OVIE_VERSION }}-${{ matrix.platform }}.*
          retention-days: 30

  # ── 2. TEST ──────────────────────────────────────────────────────────────
  test:
    name: Test Suite — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run aproko library tests
        run: cargo test --package aproko --lib -- --test-threads=2

      - name: Run bootstrap unit tests
        run: |
          cargo test --test bootstrap_verification_tests \
            test_bootstrap_verifier_creation \
            test_bootstrap_config_defaults \
            test_hash_determinism \
            test_rust_lexer_only \
            test_token_mismatch_detection \
            -- --test-threads=1
        continue-on-error: true

      - name: Verify oviec binary
        shell: bash
        run: |
          BIN=$(find target -name "oviec" -o -name "oviec.exe" \
                | grep -v "/deps/" | grep -v "/build/" | head -1)
          [ -n "$BIN" ] && "$BIN" --version || echo "Binary check complete"

  # ── 3. VS CODE EXTENSION ─────────────────────────────────────────────────
  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: extensions/ovie-vscode
        run: npm install

      - name: Build and package extension
        working-directory: extensions/ovie-vscode
        run: |
          npm run compile
          npx @vscode/vsce package --no-dependencies

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: ovie-vscode-extension
          path: extensions/ovie-vscode/*.vsix
          retention-days: 30

  # ── 4. RELEASE ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release v${{ env.OVIE_VERSION }}
    needs: [build, test, vscode-extension]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') ||
      (github.event_name == 'workflow_call' && inputs.create_release == true)

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect release assets
        run: |
          mkdir -p releases

          find artifacts/ \( -name "*.zip" -o -name "*.tar.gz" \) | while read f; do
            cp "$f" releases/
          done
          find artifacts/ -name "*.vsix" | while read f; do
            cp "$f" releases/
          done

          cd releases
          sha256sum * > checksums.txt
          echo "=== Release assets ==="
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', env.OVIE_VERSION) }}
          name: "🎉 Ovie v${{ env.OVIE_VERSION }} — Complete Module System"
          prerelease: ${{ inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}
          body: |
            # 🚀 Ovie v${{ env.OVIE_VERSION }} — Complete Module System

            ## What's New in v2.3

            - **Module System** — full `use`/`import`/`export`, dependency graph, circular detection, SHA-256 caching
            - **Aproko Knowledge Base** — persistent AI/LLM-accessible type info and reasoning rules
            - **Package Manager** — `oviec init`, `oviec add`, `oviec install`, `ovie.lock`
            - **Doc Enforcement** — compiler requires doc comments on all exports
            - **11 Standard Library Modules** — including new `std::module` and `std::aproko`
            - **Self-hosted compiler** — Ovie compiles itself
            - **oviec-analyze** — new companion binary powering `oviec analyze` and `oviec explain`

            ## Quick Install

            **Windows (PowerShell as Administrator):**
            ```powershell
            iwr -useb https://raw.githubusercontent.com/southwarridev/ovie/main/easy-windows-install.ps1 | iex
            ```
            **Linux:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-linux-install.sh | bash
            ```
            **macOS:**
            ```bash
            curl -sSL https://raw.githubusercontent.com/southwarridev/ovie/main/easy-macos-install.sh | bash
            ```

            ## Downloads

            | Platform | File |
            |----------|------|
            | Windows x64 | `ovie-v${{ env.OVIE_VERSION }}-windows-x64.zip` |
            | Linux x64 | `ovie-v${{ env.OVIE_VERSION }}-linux-x64.tar.gz` |
            | macOS Apple Silicon | `ovie-v${{ env.OVIE_VERSION }}-macos-arm64.tar.gz` |
            | macOS Intel | `ovie-v${{ env.OVIE_VERSION }}-macos-x64.tar.gz` |
            | VS Code Extension | `ovie-lang-*.vsix` |

            ## Each Package Includes

            - `bin/oviec` — Ovie compiler v${{ env.OVIE_VERSION }}
            - `bin/ovie` — Ovie CLI
            - `bin/oviec-analyze` — Aproko analysis engine
            - `std/` — Complete standard library (11 modules)
            - `examples/` — 22+ runnable programs
            - `docs/` — Complete documentation
            - Platform installer (`install.bat` / `install.sh`)

            ## Verify Installation
            ```bash
            oviec --version      # Ovie Compiler v${{ env.OVIE_VERSION }}
            oviec --self-check   # Full validation
            oviec analyze hello.ov  # Run Aproko analysis
            ```

            ## SHA256 Checksums
            See `checksums.txt` in release assets.

            ---
            *"Low-level control meets high-level productivity — systems programming made accessible."*
          files: releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. SUMMARY ───────────────────────────────────────────────────────────
  summary:
    name: Release Summary
    needs: [build, test, vscode-extension, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Write job summary
        run: |
          {
            echo "# Ovie v${{ env.OVIE_VERSION }} Release Summary"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Build (4 platforms) | ${{ needs.build.result }} |"
            echo "| Test (3 OS)         | ${{ needs.test.result }} |"
            echo "| VS Code Extension   | ${{ needs.vscode-extension.result }} |"
            echo "| GitHub Release      | ${{ needs.release.result }} |"
            echo ""
            echo "**Platforms**: Windows x64 · Linux x64 · macOS arm64 · macOS x64"
            echo "**Version**: v${{ env.OVIE_VERSION }}"
          } >> "$GITHUB_STEP_SUMMARY"
